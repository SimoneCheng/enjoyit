<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enjoyit - 揪團小幫手</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f2f5; }
        .container { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #1c1e21; margin-bottom: 2rem; }
        
        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #f0f2f5; margin-bottom: 1.5rem; }
        .tab { flex: 1; text-align: center; padding: 1rem; cursor: pointer; color: #65676b; font-weight: 600; transition: all 0.3s; }
        .tab.active { color: #1877f2; border-bottom: 3px solid #1877f2; }
        
        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; color: #4b4f56; font-size: 0.9rem; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        input:focus { outline: none; border-color: #1877f2; box-shadow: 0 0 0 2px #e7f3ff; }
        
        button { width: 100%; padding: 0.85rem; background: #1877f2; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: 600; margin-top: 1rem; transition: background 0.2s; }
        button:hover { background: #166fe5; }

        .message { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; display: none; font-size: 0.95rem; line-height: 1.4; text-align: center; }
        .error { background: #ffebe9; color: #b00020; border: 1px solid #ff8182; }
        .success { background: #e7f3ff; color: #0064d2; border: 1px solid #1877f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enjoyit 揪團</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">登入群組</div>
            <div class="tab" onclick="switchTab('register')">建立群組</div>
        </div>

        <!-- 登入表單 -->
        <div id="loginSection" class="form-section active">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginId">群組帳號</label>
                    <input type="text" id="loginId" required placeholder="輸入已建立的帳號">
                </div>
                <div class="form-group">
                    <label for="loginPassword">密碼</label>
                    <input type="password" id="loginPassword" required placeholder="輸入密碼">
                </div>
                <button type="submit">進入群組</button>
            </form>
        </div>

        <!-- 註冊表單 -->
        <div id="registerSection" class="form-section">
            <form id="registerForm">
                <div class="form-group">
                    <label for="regId">新群組帳號</label>
                    <input type="text" id="regId" required placeholder="例如：我的辦公室點餐">
                </div>
                <div class="form-group">
                    <label for="regPassword">群組密碼</label>
                    <input type="password" id="regPassword" required minlength="8" placeholder="至少 8 碼">
                </div>
                <button type="submit">立即建立</button>
            </form>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        const messageDiv = document.getElementById('message');

        // 清空所有輸入框
        function clearInputs() {
            document.querySelectorAll('input').forEach(input => input.value = '');
        }

        // 切換頁籤
        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            
            messageDiv.style.display = 'none';
            clearInputs(); // 切換時清空

            if (type === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerSection').classList.add('active');
            }
        }

        // 登入處理
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/groups/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message, 'success');
                    // 延遲一小段時間讓使用者看見訊息後跳管理頁面
                    setTimeout(() => {
                        window.location.href = '/dashboard?groupId=' + data.groupId;
                    }, 1000);
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('連線失敗，請檢查網路', 'error');
            }
        });

        // 註冊處理
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('regId').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch('/api/groups/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, password })
                });
                const data = await response.json();

                if (response.ok) {
                    showMessage('已成功建立群組，請點擊登入進行登入', 'success');
                    clearInputs(); // 建立成功後清空
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('系統異常，請稍後再試', 'error');
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
