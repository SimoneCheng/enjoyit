<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Enjoyit - 團購管理系統</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
</head>
<body>
<nav class="navbar" th:fragment="navbar">
    <div class="nav-brand">Enjoyit 飲揪eat</div>
    <button class="logout-btn" onclick="localStorage.removeItem('groupId'); location.href='/'">登出</button>
</nav>

<aside class="sidebar" th:fragment="sidebar(active, type)">
    <!-- SPA Mode (Button based) -->
    <th:block th:if="${type} == 'spa'">
        <button class="menu-btn" id="nav-publish" th:classappend="${active} == 'publish' ? ' active'" onclick="showSection('publish')">🚀 發起團購</button>
        <button class="menu-btn" id="nav-menu" th:classappend="${active} == 'menu' ? ' active'" onclick="showSection('menu')">📋 店家菜單管理</button>
        <button class="menu-btn" id="nav-orders" th:classappend="${active} == 'orders' ? ' active'" onclick="showSection('orders')">🧾 團購訂單</button>
    </th:block>

    <!-- Classic Mode (Link based) -->
    <th:block th:if="${type} != 'spa'">
        <a class="menu-btn" th:classappend="${active} == 'publish' ? ' active'" th:href="@{/dashboard/publish}">🚀 發起團購</a>
        <a class="menu-btn" th:classappend="${active} == 'menu' ? ' active'" th:href="@{/dashboard/menu}">📋 店家菜單管理</a>
        <a class="menu-btn" th:classappend="${active} == 'orders' ? ' active'" th:href="@{/dashboard/orders}">🧾 團購訂單</a>
    </th:block>
</aside>
</body>
</html>
