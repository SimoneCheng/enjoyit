<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Enjoyit - 團購訂單')"></head>
<body>
<nav th:replace="fragments/layout :: navbar"></nav>

<div class="main-layout">
    <aside th:replace="fragments/layout :: sidebar('orders', 'classic')"></aside>

    <main class="content-area">
        <section th:fragment="list">
            <h2>團購訂單</h2>
            <div class="sidebar-title">進行中的團購</div>
            <div id="activeOrdersList"></div>
            <div id="ordersEmpty" style="display:none; margin-top: 12px; color: #8e9196;">
                尚無團購訂單，請先到「發起團購」建立。
            </div>
        </section>

        <section id="orderDetailSection" style="margin-top: 20px; display:none;" th:fragment="detail">
            <h2 id="viewingOrderName">請選擇一筆團購</h2>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div id="orderAnnouncementDisplay" style="color: #666; font-style: italic; padding: 10px; background: #fffde7; border-left: 4px solid #fdd835; flex: 1;"></div>
                <div style="margin-left: 20px; font-weight: bold; color: var(--danger-color);" id="deadlineDisplay"></div>
            </div>

            <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <h3 style="margin-top: 0; color: var(--primary-color);">🍔 參與者點餐區</h3>
                <p style="margin-top: 0; color: #666;">
                    所有人共用同一個團購群組帳號，因此每筆餐點都必須填寫實際訂購人的姓名。本人訂或代訂都走同一個流程。
                </p>
                <div id="dynamicOrderMenuContainer">
                    載入菜單中...
                </div>
            </div>

            <div style="background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ececec;">
                <h3 style="margin-top: 0; color: var(--primary-color);">🛒 待送出清單</h3>
                <p style="margin-top: 0; color: #666;">
                    先把奶茶、雞排等品項加進清單，確認完後再一次送出。
                </p>
                <div id="draftOrdersList"></div>
                <div style="margin-top: 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <button class="action-btn success-btn" id="submitDraftOrdersBtn" onclick="submitDraftOrders()">一次送出待送出清單</button>
                    <button class="action-btn danger-btn" onclick="clearDraftOrders()">清空待送出清單</button>
                </div>
            </div>

            <div style="background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ececec;">
                <h3 style="margin-top: 0; color: var(--primary-color);">🧾 此裝置已送出的餐點</h3>
                <p style="margin-top: 0; color: #666;">
                    只有用同一台裝置與瀏覽器送出的餐點，才可以在這裡修改或取消。
                </p>
                <div id="participantOrdersMessage" style="display:none; margin-bottom: 10px; color: #b26a00; background: #fff7e6; padding: 10px; border-radius: 6px;"></div>
                <div id="participantOrdersList"></div>
            </div>

            <div class="btn-group">
                <div style="flex: 1; display: flex; gap: 10px; align-items: center;">
                    <input type="datetime-local" id="updateDeadlineInput" style="width: auto;">
                    <button class="action-btn" style="background: #6c757d;" onclick="adminAction('deadline')">更新截止時間</button>
                </div>
                <button class="action-btn danger-btn" id="closeOrderBtn" onclick="adminAction('close')">🔒 結束團購</button>
                <button class="action-btn success-btn" onclick="adminAction('summary')">📊 輸出訂單明細總表</button>
            </div>
            <div id="summaryResult" style="margin-top: 15px;"></div>
        </section>
    </main>
</div>

<script th:src="@{/dashboard-base.js}"></script>
<script th:src="@{/orders.js}"></script>
</body>
</html>
