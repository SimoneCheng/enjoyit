<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Enjoyit - 團購管理系統')"></head>
<body>

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="main-layout">
    <!-- 使用 layout.html 定義的側邊欄，帶入 'spa' 參數 -->
    <aside th:replace="fragments/layout :: sidebar('publish', 'spa')"></aside>

    <main class="content-area">
        <!-- 發起團購區塊 -->
        <section id="publishSection" class="section-content active">
            <div th:replace="publish :: content"></div>
        </section>

        <!-- 菜單管理區塊 -->
        <section id="menuSection" class="section-content">
            <div th:replace="menu :: content"></div>
        </section>

        <!-- 團購訂單區塊 (包含列表與詳情) -->
        <section id="ordersSection" class="section-content">
            <div th:replace="orders :: list"></div>
            <div th:replace="orders :: detail"></div>
        </section>
    </main>
</div>

<script>
    function showSection(id) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.sidebar .menu-btn').forEach(b => b.classList.remove('active'));
        const section = document.getElementById(id + 'Section');
        if (section) section.classList.add('active');
        const navBtn = document.getElementById('nav-' + id);
        if (navBtn) navBtn.classList.add('active');
    }
</script>

<script th:src="@{/dashboard-base.js}"></script>
<script th:src="@{/publish.js}"></script>
<script th:src="@{/orders.js}"></script>
<script th:src="@{/menu.js}"></script>
</body>
</html>
