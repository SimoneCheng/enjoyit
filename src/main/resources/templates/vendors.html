<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="header-action">
        <h2>🏪 店家管理</h2>
        <button class="primary-btn" onclick="openVendorForm()">➕ 新增店家</button>
    </div>

    <!-- 店家列表 -->
    <div class="vendor-list-container">
        <table class="data-table">
            <thead>
            <tr>
                <th>店家名稱</th>
                <th>電話</th>
                <th>地址</th>
                <th>狀態</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="vendorTableBody">
                <!-- 由 JavaScript 動態渲染 -->
            </tbody>
            </table>
            </div>

            <!-- 新增/編輯 Modal -->
            <div id="vendorModal" class="modal">
            <div class="modal-content">
            <h3 id="modalTitle">新增店家</h3>
            <form id="vendorForm" onsubmit="handleVendorSubmit(event)">
                <input type="hidden" id="vendorId">
                <div class="form-group">
                    <label for="vendorName">店家名稱 (必填)</label>
                    <input type="text" id="vendorName" required>
                </div>
                <div class="form-group">
                    <label for="vendorPhone">電話 (必填)</label>
                    <input type="text" id="vendorPhone" required>
                </div>
                <div class="form-group">
                    <label for="vendorAddress">地址 (必填)</label>
                    <input type="text" id="vendorAddress" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="secondary-btn" onclick="closeVendorModal()">取消</button>
                    <button type="submit" class="primary-btn">儲存</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
